name: Periodic

on:
  workflow_dispatch:
  schedule:
  - cron: "19 6 * * 1"

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
      - name: print latest_commit
        run: echo ${{ github.sha }}

      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list  --after="7 days"  ${{ github.sha }}) && echo "::set-output name=should_run::false"

  build:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Cache GHCup toolchain
      uses: actions/cache@v6
      with:
        path: ~/.ghcup
        key: ghcup-${{ matrix.os }}-ghc9.6-cabal3.10-v1

    - name: Set up Haskell
      uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: '9.6'
        cabal-version: '3.10'
        cabal-update: true

    - name: Generate Cache Keys
      id: cache_key
      run: |
        echo "ghc_ver=${{ steps.setup.outputs.ghc-version }}" >> $GITHUB_ENV
        cabal freeze
        echo "dep_hash=$(md5sum cabal.project.freeze | awk '{print $1}')" >> $GITHUB_ENV

    - name: Cache Dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cabal
          dist-newstyle
        key: ${{ matrix.os }}-ghc-${{ env.ghc_ver }}-cabal-${{ env.dep_hash }}

    - name: Build & Test
      run: |
        cabal build
        cabal test --test-show-details=streaming

  docker:
    runs-on: ubuntu-latest
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/tesladb:latest
          ghcr.io/${{ github.repository_owner }}/tesladb:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/tesladb:cache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/tesladb:cache,mode=max
