name: Haskell

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  cabal:
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current setup: pinned GHC/Cabal, ghcup install every run, no ghcup cache.
          - variant: current
            ghc-version: '9.6'
            cabal-version: '3.10'
            use-ghcup-cache: false
          # Option B: same pinned GHC/Cabal, but with the ghcup toolchain cached.
          - variant: cached
            ghc-version: '9.6'
            cabal-version: '3.10'
            use-ghcup-cache: true
          # Option A: use the GHC/Cabal versions pre-installed on the runner image,
          # so setup should skip installation entirely.
          - variant: preinstalled
            ghc-version: '9.14'
            cabal-version: '3.18'
            use-ghcup-cache: false
    name: cabal (${{ matrix.variant }})
    steps:
    - uses: actions/checkout@v6

    - name: Cache GHCup toolchain
      if: matrix.use-ghcup-cache
      uses: actions/cache@v5
      with:
        path: ~/.ghcup
        key: ghcup-${{ runner.os }}-ghc${{ matrix.ghc-version }}-cabal${{ matrix.cabal-version }}-v1

    - name: Set up Haskell
      uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc-version }}
        cabal-version: ${{ matrix.cabal-version }}
        cabal-update: true

    - name: Setup haskell deps and tools
      run: |
        cabal install tasty-discover

    - name: Generate Cache Keys
      id: cache_key
      run: |
        echo "ghc_ver=${{ steps.setup.outputs.ghc-version }}" >> $GITHUB_ENV
        cabal freeze
        echo "dep_hash=$(md5sum cabal.project.freeze | awk '{print $1}')" >> $GITHUB_ENV

    - name: Cache Dependencies
      id: cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cabal
          dist-newstyle
        key: ubuntu-latest-${{ matrix.variant }}-ghc-${{ env.ghc_ver }}-cabal-${{ env.dep_hash }}

    - name: Build & Test
      run: |
        cabal build
        cabal test --test-show-details=streaming
        cabal install exe:teslauth exe:tesladb exe:teslacatcher --installdir=./dist --overwrite-policy=always

    - name: Store Artifact
      uses: actions/upload-artifact@v7
      with:
        name: tesladb-ubuntu-latest-${{ matrix.variant }}
        path: dist
